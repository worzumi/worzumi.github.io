<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worzumi</title>
<meta name="description" content="Worzumi is a word game for iPhone: swap two letters and find new words.">
<style>
:root { --bg: #0f1534; --ink: #eef1ff; --muted: #b3bbe0; --accent: #ffd84d; --line: #2b3566; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #2a3a9c, var(--bg) 60%); color: var(--ink); font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 3rem 1rem; }
img { width: 140px; height: 140px; border-radius: 32px; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
h1 { font-size: 2.6rem; margin: 1.25rem 0 .25rem; }
.tag { color: var(--muted); max-width: 32rem; margin: .25rem auto; }
.links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 2rem; }
.links a { color: var(--bg); background: var(--accent); text-decoration: none; font-weight: 700; padding: .6rem 1.4rem; border-radius: 999px; }
.links a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
footer { margin-top: auto; padding-top: 3rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
  <img src="icon.png" alt="Worzumi app icon">
  <h1>Worzumi</h1>
  <p class="tag" lang="en">Swap two letters. Find words. A word game for iPhone in English, Swedish, German and Spanish.</p>
  <p class="tag" lang="sv">Byt två bokstäver. Hitta ord.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy</a>
  </div>
  <footer>© 2026 Worzumi · <a href="mailto:worzumi@gmail.com" style="color:inherit">worzumi@gmail.com</a></footer>
</body>
</html>
